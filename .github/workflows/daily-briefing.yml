name: 每日简报生成

on:
  schedule:
    - cron: "0 9 * * 1-5"   # UTC 时间 9:00 = 北京时间 17:00（工作日）
  workflow_dispatch:          # 允许手动触发

permissions:
  contents: write              # 允许提交简报文件

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: 运行简报生成脚本
        env:
          TDOCS_API_BASE: ${{ secrets.TDOCS_API_BASE }}
          TDOCS_TOKEN: ${{ secrets.TDOCS_TOKEN }}
        run: |
          python3 generate_daily_briefing.py
      
      - name: 提交简报文件
        run: |
          git config user.name "Daily Briefing Bot"
          git config user.email "briefing-bot@example.com"
          
          mkdir -p archive
          if [ -f "partner_daily_briefing.html" ]; then
            cp partner_daily_briefing.html "archive/briefing_$(TZ=Asia/Shanghai date +%Y%m%d).html"
            git add partner_daily_briefing.html daily_data.json "archive/briefing_$(TZ=Asia/Shanghai date +%Y%m%d).html"
            if git commit -m "📋 每日简报 $(TZ=Asia/Shanghai date +%Y-%m-%d)"; then
              git push
            else
              echo "无变化，跳过提交与推送"
            fi
          fi

      - name: 主动防护 - 实时失败时标红运行
        run: |
          if [ -f "daily_data.json" ]; then
            LIVE_FAILED=$(python3 -c "import json,sys; d=json.load(open('daily_data.json')); print('true' if d.get('live_failed') else 'false')")
            if [ "$LIVE_FAILED" = "true" ]; then
              echo "::error::主动防护触发：实时数据获取失败，简报已回退至缓存/快照。请检查仓库 Secrets 中的 TDOCS_TOKEN / TDOCS_API_BASE 配置或腾讯文档服务状态。"
              exit 1
            else
              echo "✅ 主动防护未触发：实时数据获取成功。"
            fi
          fi

      - name: 推送个人微信（PushPlus）
        if: always()
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "未配置 PUSHPLUS_TOKEN，跳过个人微信推送"
            exit 0
          fi
          python3 push_pushplus.py

